name: daily-video

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 10 * * *"        # كل يوم 1 ظهراً بتوقيت الرياض (10:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "run = حلقة جديدة | selftest_online = فحص المزودين | selftest_offline = فحص محلي"
        default: "run"
        type: choice
        options: [run, selftest_online, selftest_offline, selftest_email]

permissions:
  contents: write

concurrency:
  group: daily-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core fontconfig libraqm0

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Offline production self-test
        run: python selftest.py --offline

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core fontconfig libraqm0

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Self test (offline)
        if: ${{ github.event.inputs.mode == 'selftest_offline' }}
        run: python selftest.py --offline

      - name: Self test (online)
        if: ${{ github.event.inputs.mode == 'selftest_online' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python selftest.py --online

      - name: Self test (email)
        if: ${{ github.event.inputs.mode == 'selftest_email' }}
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python selftest.py --email

      - name: Make today's episode
        if: ${{ github.event.inputs.mode == '' || github.event.inputs.mode == 'run' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          VEO_ENABLED: ${{ vars.VEO_ENABLED }}
          LOCATION: ${{ vars.LOCATION }}
          SPEECH_VIDEO: ${{ vars.SPEECH_VIDEO }}
        run: python main.py

      - name: Upload episode
        if: ${{ always() && (github.event.inputs.mode == '' || github.event.inputs.mode == 'run') }}
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore

      - name: Save history
        if: ${{ success() && (github.event.inputs.mode == '' || github.event.inputs.mode == 'run') }}
        run: |
          git config user.name "daily-video-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "history: new episode" && git pull --rebase origin ${{ github.ref_name }} && git push)

  youtube_upload:
    needs: build
    # Upload automatically after a successful episode build; publisher enforces Private visibility.
    if: ${{ needs.build.result == 'success' && (github.event.inputs.mode == '' || github.event.inputs.mode == 'run') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out publisher code
        uses: actions/checkout@v4

      - name: Download reviewed episode
        uses: actions/download-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: output/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YouTube upload dependencies
        run: pip install requests google-api-python-client google-auth

      - name: Upload episode as Private for owner review
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: private
          YT_UPLOAD_REVIEWED: "1"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python publish_youtube.py
